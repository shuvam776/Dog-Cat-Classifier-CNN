<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dog vs Cat Classifier</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Inter',sans-serif;
}
</style>

</head>

<body class="bg-slate-100">

<div class="max-w-3xl mx-auto py-10 px-5">

<h1 class="text-3xl font-bold text-center text-green-700">
Dog vs Cat Classifier
</h1>

<p class="text-center text-gray-500 mt-2 mb-8">
ResNet50 • ONNX Runtime
</p>

<div class="bg-white rounded-xl shadow-md border p-6">

<form action="/predict" method="POST" enctype="multipart/form-data">

<label id="dropzone"
for="image"
class="border-2 border-dashed border-green-500 rounded-lg h-72 flex flex-col items-center justify-center cursor-pointer hover:bg-green-50 transition">

<img id="preview"
class="hidden h-full w-full object-cover rounded-lg">

<div id="placeholder">

<svg xmlns="http://www.w3.org/2000/svg"
class="w-14 h-14 text-green-600 mx-auto"
fill="none"
viewBox="0 0 24 24"
stroke="currentColor">

<path stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>

</svg>

<p class="mt-4 text-lg font-medium text-gray-700">
Choose an image
</p>

<p class="text-sm text-gray-400 mt-1">
PNG • JPG • JPEG • WEBP
</p>

</div>

<input
type="file"
id="image"
name="image"
accept=".jpg,.jpeg,.png,.webp,image/*"
required
class="hidden">

</label>

<button
class="mt-6 w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-semibold transition">

Predict

</button>

</form>

</div>

{% if image %}

<div class="bg-white rounded-xl shadow-md border p-6 mt-8">

<h2 class="text-xl font-semibold text-gray-800 mb-5">
Prediction Result
</h2>

<img
src="{{ image }}"
class="rounded-lg w-full h-80 object-cover">

<div class="mt-6 space-y-5">

<div>

<div class="flex justify-between">

<span class="text-gray-500">
Prediction
</span>

<span class="font-semibold text-green-700">

{{ prediction }}

</span>

</div>

</div>

<div>

<div class="flex justify-between mb-2">

<span class="text-gray-500">
Confidence
</span>

<span>

{{ confidence }}%

</span>

</div>

<div class="w-full bg-gray-200 rounded-full h-3">

<div
class="bg-green-600 h-3 rounded-full"
style="width: {{ confidence }}%">

</div>

</div>

</div>

<div class="flex justify-between">

<span class="text-gray-500">
Inference Time
</span>

<span>

{{ inference_time }} sec

</span>

</div>

</div>

</div>

{% endif %}

</div>

<script>

const input=document.getElementById("image");

const preview=document.getElementById("preview");

const placeholder=document.getElementById("placeholder");

input.onchange=function(){

const file=this.files[0];

if(!file) return;

preview.src=URL.createObjectURL(file);

preview.classList.remove("hidden");

placeholder.classList.add("hidden");

}

</script>

</body>
</html>
